<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة تنظيم الشغل</title>

  <style>
    /* =========================================================
      1) RESET عام
      الهدف: نمنع أي مسافات افتراضية ونخلي الحسابات أسهل.
    ========================================================= */
    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      height:100%;
      font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;
      background:linear-gradient(180deg,#eef7ff,#fff3fb);
      color:#1f2d46;
      overflow:hidden;
    }
    body{padding:10px}

    /* =========================================================
      2) الهيكل الأساسي للصفحة
      app = الهيدر فوق + المبنى تحت.
    ========================================================= */
    .app{
      height:calc(100vh - 20px);
      display:grid;
      grid-template-rows:86px 1fr;
      gap:10px;
    }

    /* =========================================================
      3) الشريط العلوي: العنوان + الإحصائيات + الأزرار
    ========================================================= */
    .topbar{
      background:#ffffffdf;
      border-radius:26px;
      box-shadow:0 14px 34px rgba(30,50,90,.15);
      display:grid;
      grid-template-columns:1fr auto auto;
      gap:12px;
      align-items:center;
      padding:12px 16px;
      backdrop-filter:blur(10px);
    }
    .titleWrap{display:flex;align-items:center;gap:12px}
    .logo{
      width:56px;height:56px;border-radius:18px;
      background:#203b62;color:white;
      display:grid;place-items:center;font-size:26px;
    }
    h1{margin:0;font-size:34px;line-height:1;font-weight:900}
    .sub{font-size:13px;color:#6c7b91;margin-top:6px}

    .stats{display:flex;gap:10px;flex-wrap:wrap}
    .stat{
      min-width:104px;border-radius:20px;padding:8px 12px;text-align:center;
      font-weight:900;background:#f2f5f8;
    }
    .stat b{display:block;font-size:26px}
    .stat.active{background:#eaffef;color:#147a37}
    .stat.meeting{background:#fff0f9;color:#a1217d}
    .stat.off{background:#eef2f6;color:#5d6878}
    .stat.tasks{background:#fff5dc;color:#b36a00}

    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{
      border:0;border-radius:16px;padding:11px 14px;
      background:#243b5e;color:white;font-weight:900;cursor:pointer;
      box-shadow:0 8px 18px rgba(36,59,94,.16);
      transition:.2s ease;
    }
    .btn.light{background:white;color:#243b5e}
    .btn:hover{transform:translateY(-1px)}

    /* =========================================================
      4) المبنى 3D
      الهدف: شكل أوضح من مجرد مستطيل، مع ظل وعمق بسيط.
    ========================================================= */
    .buildingWrap{
      min-height:0;
      overflow:auto;
      border-radius:30px;
      padding:18px;
      background:linear-gradient(180deg,#eaf4ff,#fff0fb);
      box-shadow:inset 0 0 0 3px rgba(54,82,125,.14);
    }
    .building{
      position:relative;
      min-height:100%;
      padding:76px 20px 22px;
      border:4px solid #36527d;
      border-radius:24px 24px 30px 30px;
      background:linear-gradient(135deg,#ffe0ec,#f7c9df 55%,#efbdd6);
      box-shadow:
        0 24px 50px rgba(35,54,88,.22),
        inset 10px 0 0 rgba(255,255,255,.25),
        inset -10px -10px 0 rgba(120,70,110,.08);
    }
    /* سقف المبنى */
    .building::before{
      content:"";
      position:absolute;
      left:-10px;right:-10px;top:-38px;height:82px;
      background:linear-gradient(180deg,#486a9c,#35507a);
      clip-path:polygon(50% 0,100% 62%,100% 100%,0 100%,0 62%);
      filter:drop-shadow(0 9px 12px rgba(38,56,90,.25));
      z-index:0;
    }
    .buildingTitle{
      position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:3;
      background:#ffffffd9;border:2px solid #36527d;border-radius:16px;
      padding:8px 18px;font-weight:900;color:#253b5c;
      box-shadow:0 10px 18px rgba(0,0,0,.08);
      white-space:nowrap;
    }

    /* =========================================================
      5) شبكة الحجرات
      كل كارت = حجرة. يوسف موجود كأول حجرة بنفس حجم الباقي.
    ========================================================= */
    .grid{
      position:relative;
      z-index:2;
      display:grid;
      grid-template-columns:repeat(4,minmax(220px,1fr));
      grid-auto-rows:185px;
      gap:10px;
      align-content:start;
    }
    .cell{
      border:2px solid #36527d;
      background:#cfe4f3;
      position:relative;
      overflow:hidden;
      box-shadow:
        inset 5px 5px 0 rgba(255,255,255,.25),
        inset -5px -5px 0 rgba(30,50,80,.08);
    }
    .addCell{display:grid;place-items:center;background:#d9e9f4}
    .addCell button{
      border:0;background:#243b5e;color:white;border-radius:18px;
      padding:12px 18px;font-weight:900;cursor:pointer;
    }

    /* =========================================================
      6) شكل الحجرة حسب الحالة
      active: شغال | meeting: اجتماع | sleep: نايم | leave: إجازة
    ========================================================= */
    .room{
      height:100%;position:relative;overflow:hidden;cursor:pointer;
      background:linear-gradient(135deg,#fff7be,#fff8db);
      box-shadow:inset 8px 8px 0 rgba(255,255,255,.32), inset -8px -8px 0 rgba(100,60,20,.06);
      transition:background .35s ease, transform .25s ease;
    }
    .room:hover{transform:scale(1.01)}
    .room.leader{outline:3px solid #ffcf24;outline-offset:-5px}
    .room.sleep{background:radial-gradient(circle at 45% 32%,#5db8f3 0,#2a82c6 42%,#17629d 100%)}
    .room.leave{background:radial-gradient(circle at 46% 32%,#9bd9ff 0,#4c9ade 45%,#1b67a7 100%)}
    .room.meeting{background:linear-gradient(135deg,#ffe6fb,#fff1ba)}
    .room::before{
      content:"";position:absolute;inset:0;
      background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(0,0,0,.06));
      pointer-events:none;
    }
    .sleep::before,.leave::before{background:rgba(0,0,0,.18)}

    /* أزرار الحذف والإعدادات */
    .delete,.settings{
      position:absolute;top:4px;z-index:20;
      border:1px solid #777;background:white;cursor:pointer;font-weight:900;
    }
    .delete{
      left:4px;width:18px;height:18px;border-radius:50%;color:#ff5a68;border-color:#ff5a68;
      line-height:15px;padding:0;
    }
    .settings{
      left:26px;width:20px;height:20px;border-radius:6px;color:#243b5e;line-height:18px;padding:0;font-size:12px;
    }
    .room.leader .delete{display:none}

    /* اسم الشخص + النقطة الخضراء */
    .statusName{
      position:absolute;right:6px;top:5px;z-index:12;
      display:flex;align-items:center;gap:5px;
      max-width:128px;background:#fff;border:1px solid rgba(0,0,0,.25);
      border-radius:7px;padding:2px 6px;font-size:9.5px;font-weight:900;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1f2d46;
    }
    .dot{width:8px;height:8px;border-radius:50%;background:#c7ccd5}
    .active .dot{background:#25c35a}
    .meeting .dot{background:#ff65c8}

    /* =========================================================
      7) اللمبة + الإضاءة الناعمة
    ========================================================= */
    .lamp{
      position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:5;width:38px;height:30px;
    }
    .lamp::before{content:"";position:absolute;left:17px;top:0;width:4px;height:13px;background:#333}
    .lamp::after{
      content:"";position:absolute;left:3px;top:13px;
      border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:19px solid #595959;
    }
    .glow{
      position:absolute;left:50%;top:17px;transform:translateX(-50%);
      width:100px;height:74px;border-radius:50%;
      background:rgba(255,248,168,.65);filter:blur(6px);z-index:1;
      animation:lampPulse 2.4s ease-in-out infinite;
    }
    .sleep .glow,.leave .glow{background:rgba(255,255,255,.08);animation:none}
    .meeting .glow{background:rgba(255,180,245,.48)}
    @keyframes lampPulse{
      0%,100%{opacity:.72;transform:translateX(-50%) scale(.96)}
      50%{opacity:1;transform:translateX(-50%) scale(1.05)}
    }

    /* لوحة التاسكات */
    .taskPanel{
      position:absolute;right:8px;top:38px;width:44px;min-height:40px;
      background:#f6cf28;border:2px solid #c58a00;border-radius:5px;z-index:12;
      text-align:center;font-weight:900;color:#7b4700;
    }
    .taskPanel .small{font-size:7px;margin-top:3px}
    .taskPanel input{
      width:33px;background:#fff4b0;border:1px solid #b77a00;text-align:center;
      font-size:14px;font-weight:900;border-radius:4px;color:#6d3d00;
    }
    .sleep .taskPanel,.leave .taskPanel{background:#5d8ed5;border-color:#315d9e;color:#fff}
    .zero .taskPanel{display:none}

    /* أزرار النمط: سمعي/أدائي/بصري */
    .domain{position:absolute;right:8px;bottom:26px;display:flex;gap:3px;z-index:14}
    .domain button{width:17px;height:17px;border:1px solid #555;border-radius:4px;cursor:pointer;font-size:10px;padding:0}
    .audio{background:#ffd84a}.perf{background:#b05cff;color:#fff}.visual{background:#ff7bc4;color:#fff}
    .domain button.on{outline:2px solid #111}
    .room.leader .domain button{outline:1px solid #111;filter:saturate(1.3)}

    /* البوب الكوميدي */
    .bubble{
      position:absolute;z-index:14;right:50%;top:40px;transform:translateX(6px);
      width:88px;background:#fff;border:1px solid #666;border-radius:8px;padding:5px 6px;
      font-size:8px;line-height:1.25;font-weight:800;color:#222;text-align:center;
      opacity:0;animation:bubble 5.8s ease-in-out infinite;
      box-shadow:0 4px 8px rgba(0,0,0,.12);pointer-events:none;
    }
    .bubble::after{
      content:"";position:absolute;right:-6px;top:18px;width:11px;height:11px;background:#fff;
      border-right:1px solid #666;border-top:1px solid #666;transform:rotate(45deg);
    }
    @keyframes bubble{
      0%,15%{opacity:0;transform:translateX(6px) translateY(6px)}
      23%,62%{opacity:1;transform:translateX(6px) translateY(0)}
      78%,100%{opacity:0;transform:translateX(6px) translateY(-8px)}
    }

    /* علامات النوم والاجتماع والإجازة */
    .zzz{position:absolute;z-index:13;left:38%;top:33%;font-weight:900;color:#fff;font-size:20px;letter-spacing:2px;animation:zzz 1.6s infinite ease-in-out}
    @keyframes zzz{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-8px);opacity:1}}
    .ghost{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:6;width:48px;height:78px;background:rgba(255,255,255,.76);border-radius:50% 50% 44% 44%}
    .leaveSign{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      background:#fff;border:2px solid #ff6aa0;border-radius:12px;padding:6px 10px;
      font-size:12px;font-weight:900;z-index:20;color:#ff3b8d;box-shadow:0 4px 10px rgba(0,0,0,.2);
    }
    .meetIcon{position:absolute;left:12px;bottom:50px;background:#fff;border:1px solid #666;border-radius:8px;padding:3px 6px;font-size:9px;font-weight:900;z-index:13;display:none}
    .meeting .meetIcon{display:block}

    /* =========================================================
      8) الترابيزة + المج + اللابتوب
    ========================================================= */
    .desk{position:absolute;left:28%;right:28%;bottom:8px;height:14px;background:#e78448;border-top:2px solid #b85c29;z-index:9;border-radius:8px}
    .desk::before,.desk::after{content:"";position:absolute;bottom:-12px;width:7px;height:12px;background:#bd6635}
    .desk::before{left:10px}.desk::after{right:10px}

    .mug{position:absolute;left:calc(28% + 8px);bottom:22px;width:24px;height:24px;border:2px solid #252b35;border-radius:4px;background:#5aa0ff;z-index:15}
    .female .mug{background:#ff9ad4}
    .mug::after{content:"";position:absolute;right:-9px;top:7px;width:8px;height:8px;border:2px solid #252b35;border-left:0;border-radius:0 9px 9px 0}
    .sleep .mug{transform:rotate(-15deg)}
    .mugIcon{position:absolute;inset:3px;background:#ffe054;border-radius:2px}
    .female .mugIcon{background:#fff}
    .female .mugIcon::before{content:"♥";position:absolute;font-size:10px;color:#ec3b87;line-height:11px;right:1px}

    .laptop{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:58px;height:32px;background:#2f4e78;border:2px solid #1d2a3c;z-index:14}
    .female .laptop{background:#ff9ad4}
    .laptop::before{content:"SPACETOON";position:absolute;left:4px;right:4px;bottom:4px;background:#ffcf24;color:#e52a20;border:1px solid #d98600;font-size:6px;text-align:center;font-weight:900;line-height:10px}
    .laptop::after{display:none}
    .sleep .laptop{background:#67717e}
    .sleep .laptop::before{opacity:.35}
    .bow{display:none;position:absolute;right:-7px;top:-9px;width:14px;height:10px}
    .female .bow{display:block}
    .bow::before,.bow::after{content:"";position:absolute;width:8px;height:8px;background:#ff4cab;border-radius:50%}
    .bow::before{left:0}.bow::after{right:0}

    /* الكاركتر المرسوم بالـ canvas */
    canvas.char{
      position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:7;
      width:76px;height:96px;image-rendering:pixelated;
      filter:drop-shadow(0 5px 5px rgba(0,0,0,.12));
      animation:idle 2.2s ease-in-out infinite;
    }
    .sleep canvas.char{bottom:10px;transform:translateX(-50%) rotate(-3deg);animation:sleepIdle 2.6s ease-in-out infinite}
    @keyframes idle{0%,100%{translate:0 0}50%{translate:0 -3px}}
    @keyframes sleepIdle{0%,100%{translate:0 0}50%{translate:0 2px}}

    /* =========================================================
      9) نافذة الإعدادات
    ========================================================= */
    .modal{position:fixed;inset:0;background:rgba(20,29,46,.46);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(5px);padding:14px}
    .modal.show{display:flex}
    .modalCard{width:min(560px,100%);background:#fff;border-radius:24px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
    .modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .modalHead h3{margin:0;font-size:26px}
    .close{border:0;background:#f1f4f8;width:38px;height:38px;border-radius:12px;cursor:pointer}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field label{display:block;font-weight:900;font-size:13px;margin-bottom:5px;color:#54647a}
    .field input,.field select{width:100%;border:1px solid #dbe4ef;border-radius:14px;padding:11px 12px;font-size:15px}
    .modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

    /* =========================================================
      RESPONSIVE — تأقلم مع كل الأحجام
      Desktop   > 1200px  → 4 columns  (الأصل)
      Tablet    768–1200  → 3 columns  مع تصغير الهيدر
      Mobile L  480–768   → 2 columns  مع تبسيط الهيدر
      Mobile S  < 480     → 1 column   موبايل كامل
    ========================================================= */

    /* ── Tablet ── */
    @media(max-width:1200px){
      html,body{overflow:auto}
      .app{height:auto;min-height:100vh;grid-template-rows:auto 1fr}
      .topbar{grid-template-columns:1fr;gap:8px;padding:10px 12px;border-radius:18px}
      h1{font-size:26px}
      .sub{font-size:11px}
      .logo{width:44px;height:44px;font-size:20px;border-radius:14px}
      .stats{gap:6px}
      .stat{min-width:80px;padding:6px 8px;border-radius:14px}
      .stat b{font-size:20px}
      .grid{grid-template-columns:repeat(3,minmax(180px,1fr));grid-auto-rows:170px}
      .fields{grid-template-columns:1fr}
      /* حجرة أصغر شوية */
      canvas.char{width:66px;height:84px}
      .laptop{width:50px;height:28px}
      .bubble{width:76px;font-size:7.5px}
    }

    /* ── Mobile Large (landscape / tablet صغير) ── */
    @media(max-width:768px){
      body{padding:6px}
      .app{gap:6px}
      .topbar{padding:8px 10px;border-radius:14px}
      h1{font-size:20px}
      .sub{display:none}
      .logo{width:38px;height:38px;font-size:18px;border-radius:12px}
      .stat{min-width:66px;padding:5px 6px;border-radius:12px}
      .stat b{font-size:17px}
      .btn{padding:8px 10px;font-size:13px;border-radius:12px}
      .buildingWrap{padding:10px;border-radius:18px}
      .building{padding:58px 10px 14px;border-radius:16px 16px 22px 22px}
      .buildingTitle{font-size:12px;padding:5px 12px;border-radius:10px;top:12px}
      .grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:160px;gap:7px}
      /* عناصر الحجرة */
      canvas.char{width:58px;height:74px;bottom:8px}
      .laptop{width:44px;height:24px;bottom:8px}
      .laptop::before{font-size:5px;line-height:9px}
      .desk{left:22%;right:22%;height:12px;bottom:6px}
      .desk::before,.desk::after{height:10px}
      .mug{width:20px;height:20px;bottom:18px}
      .mug::after{width:6px;height:6px;right:-7px;top:5px}
      .mugIcon{inset:2px}
      .taskPanel{width:36px;right:5px;top:32px}
      .taskPanel input{width:28px;font-size:12px}
      .domain{bottom:20px;right:5px;gap:2px}
      .domain button{width:14px;height:14px;font-size:8px}
      .statusName{font-size:8.5px;max-width:100px}
      .bubble{width:68px;font-size:7px;top:34px}
      .lamp{width:30px;height:24px}
      .lamp::before{left:13px;height:10px;width:3px}
      .lamp::after{left:2px;top:10px;border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:15px solid #595959}
      .glow{width:80px;height:58px}
      .meetIcon{font-size:8px;padding:2px 4px;bottom:40px;left:8px}
      .zzz{font-size:16px}
      .leaveSign{font-size:10px;padding:4px 8px}
      .delete{width:16px;height:16px;line-height:13px}
      .settings{left:22px;width:18px;height:18px;line-height:16px}
    }

    /* ── Mobile Small ── */
    @media(max-width:480px){
      .topbar{grid-template-columns:1fr}
      .stats{justify-content:center}
      .actions{justify-content:center}
      .grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:150px;gap:5px}
      canvas.char{width:52px;height:66px}
      .laptop{width:38px;height:20px}
      .laptop::before{font-size:4.5px;line-height:8px}
      .bubble{display:none} /* الـ bubble بيضغط على المحتوى في الموبايل الصغير */
      .stat{min-width:56px}
      .stat b{font-size:15px}
      h1{font-size:18px}
      .modalCard{padding:12px}
      .modalHead h3{font-size:20px}
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="topbar">
      <div class="titleWrap">
        <div class="logo">🏠</div>
        <div>
          <h1>لوحة تنظيم الشغل</h1>
          <div class="sub">كل حجرة لها حالة: نشط، نوم، إجازة، أو اجتماع — اضغطي لتغيير الحالة.</div>
        </div>
      </div>

      <div class="stats">
        <div class="stat active">نشطين<b id="activeCount">0</b></div>
        <div class="stat meeting">اجتماع<b id="meetingCount">0</b></div>
        <div class="stat off">غير نشطين<b id="sleepCount">0</b></div>
        <div class="stat tasks">التاسكات<b id="taskCount">0</b></div>
      </div>

      <div class="actions">
        <button class="btn light" id="resetBtn">Reset</button>
        <button class="btn" id="addBtn">+ إضافة حجرة</button>
      </div>
    </div>

    <div class="buildingWrap">
      <div class="building">
        <div class="buildingTitle">مبنى الفريق</div>
        <div class="grid" id="rooms"></div>
      </div>
    </div>
  </div>

  <!-- نافذة الإعدادات -->
  <div class="modal" id="modal">
    <div class="modalCard">
      <div class="modalHead">
        <h3 id="modalTitle">إعدادات الحجرة</h3>
        <button class="close" id="closeBtn">✕</button>
      </div>

      <div class="fields">
        <div class="field"><label>الاسم</label><input id="fName"></div>
        <div class="field"><label>النوع</label><select id="fGender"><option value="boy">ولد</option><option value="girl">بنت</option></select></div>
        <div class="field"><label>الحالة</label><select id="fState"><option value="active">نشط</option><option value="sleep">نايم / غير نشط</option><option value="leave">إجازة</option><option value="meeting">في اجتماع</option></select></div>
        <div class="field"><label>عدد التاسكات</label><input id="fTasks" type="number" min="0"></div>
        <div class="field"><label>النمط</label><select id="fDomain"><option value="all">سمعي + أدائي + بصري</option><option value="audio">سمعي</option><option value="perf">أدائي</option><option value="visual">بصري</option></select></div>
        <div class="field"><label>الستايل</label><select id="fLook"><option value="normal">عادي</option><option value="glasses">نضارة</option><option value="bun">كحكة</option><option value="bunGlasses">كحكة + نضارة</option></select></div>
      </div>

      <div class="modalActions">
        <button class="btn light" id="deleteBtn">مسح</button>
        <button class="btn light" id="cancelBtn">إلغاء</button>
        <button class="btn" id="saveBtn">حفظ</button>
      </div>
    </div>
  </div>

<script>
(function(){
  /* =========================================================
    10) الجمل التي تظهر في البوب حسب الحالة
  ========================================================= */
  const phrases={
    active:["شغالين بهدوء ولطف ✨","التركيز عالي والإنجاز ماشي 🚀","تاسك ورا تاسك وهنخلص 💻"],
    sleep:["استراحة صغيرة ونرجع 😴","بنشحن الطاقة شوية ☕","اللاب مستني صحوة لطيفة 😄"],
    leave:["إجازة سعيدة 🌿","خارج نطاق الشغل اليوم 😌","راحة مستحقة ✨"],
    meeting:["في اجتماع سريع 💬","Brainstorm لطيف 🧠","بنظبط الخطة ✨"]
  };

  /* =========================================================
    11) البيانات الافتراضية
    يوسف هو أول حجرة ومميز كـ leader داخل نفس الشبكة.
  ========================================================= */
  const defaults=[
    {id:'boss',name:'يوسف',gender:'boy',state:'active',tasks:5,domain:'all',look:'bunGlasses',leader:true},
    {id:1,name:'إسلام',gender:'boy',state:'leave',tasks:0,domain:'perf',look:'glasses'},
    {id:2,name:'سيد',gender:'boy',state:'sleep',tasks:0,domain:'visual',look:'normal'},
    {id:3,name:'زغلول',gender:'boy',state:'active',tasks:1,domain:'audio',look:'glasses'},
    {id:4,name:'هاجر س',gender:'girl',state:'sleep',tasks:0,domain:'visual',look:'bun'},
    {id:5,name:'هاجر أ',gender:'girl',state:'active',tasks:2,domain:'perf',look:'bunGlasses'},
    {id:6,name:'أماني',gender:'girl',state:'sleep',tasks:0,domain:'audio',look:'glasses'},
    {id:7,name:'ندى',gender:'girl',state:'active',tasks:1,domain:'visual',look:'bun'},
    {id:8,name:'ديانا',gender:'girl',state:'leave',tasks:0,domain:'audio',look:'normal'},
    {id:9,name:'ميريام',gender:'girl',state:'meeting',tasks:2,domain:'perf',look:'bun'},
    {id:10,name:'إسراء',gender:'girl',state:'sleep',tasks:0,domain:'visual',look:'bunGlasses'}
  ];

  /* اختصار للوصول للعناصر بالـ id */
  const $=id=>document.getElementById(id);

  let editingId=null;
  let rooms=loadRooms();

  function rand(arr){return arr[Math.floor(Math.random()*arr.length)]}
  function phraseFor(state){return rand(phrases[state]||phrases.active)}

  /* إضافة phrase لو مش موجودة */
  function hydrate(room){return {...room,phrase:room.phrase||phraseFor(room.state)}}

  /* تحميل البيانات من المتصفح، ولو مفيش نستخدم البيانات الافتراضية */
  function loadRooms(){
    try{
      const saved=JSON.parse(localStorage.getItem('jojo-final-dashboard-v1')||'null');
      if(Array.isArray(saved)) return saved.map(hydrate);
    }catch(e){}
    return defaults.map(hydrate);
  }

  /* حفظ البيانات في المتصفح */
  function save(){localStorage.setItem('jojo-final-dashboard-v1',JSON.stringify(rooms))}

  /* رسم مربع Pixel */
  function px(ctx,x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}

  /* =========================================================
    12) رسم الكاركتر على canvas
    كل px() = مربع صغير. S هو عامل التكبير.
  ========================================================= */
  function drawPerson(canvas,room){
    const ctx=canvas.getContext('2d'),S=4,W=38,H=48;
    canvas.width=W*S;canvas.height=H*S;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.imageSmoothingEnabled=false;
    ctx.scale(S,S);

    if(room.state==='leave') return;

    const girl=room.gender==='girl';
    const sleep=room.state==='sleep';
    const skin='#f2c59d';
    const hair=girl?'#41232a':'#111';
    const shirt=sleep?'#6f7d91':girl?'#ff77c2':'#3185e8';

    px(ctx,14,42,12,2,'rgba(0,0,0,.15)');
    px(ctx,13,27,13,14,shirt);
    px(ctx,16,29,7,2,'rgba(255,255,255,.25)');
    px(ctx,16,19,7,3,skin);
    px(ctx,12,10,15,11,skin);

    if(girl){
      px(ctx,11,8,17,4,hair);
      px(ctx,10,12,4,12,hair);
      px(ctx,25,12,4,12,hair);
      if(room.look==='bun'||room.look==='bunGlasses') px(ctx,17,5,7,4,hair);
    }else{
      px(ctx,11,8,17,5,hair);
      px(ctx,10,12,19,2,hair);
      if(room.look==='bun'||room.look==='bunGlasses') px(ctx,17,5,7,4,hair);
    }

    if(sleep){
      px(ctx,14,15,5,1,'#222');
      px(ctx,21,15,5,1,'#222');
      px(ctx,17,19,4,1,'#7a4d4d');
    }else{
      px(ctx,15,14,2,2,'#222');
      px(ctx,22,14,2,2,'#222');
      px(ctx,17,18,5,1,'#c87979');
    }

    if(room.look==='glasses'||room.look==='bunGlasses'){
      px(ctx,13,13,6,4,'rgba(255,255,255,.35)');
      px(ctx,21,13,6,4,'rgba(255,255,255,.35)');
      px(ctx,19,15,2,1,'#111');
    }

    px(ctx,9,29,4,8,skin);
    px(ctx,26,29,4,8,skin);
  }

  /* بناء أزرار النمط */
  function domainBtns(room){
    const all=room.domain==='all';
    return `
      <button class="audio ${all||room.domain==='audio'?'on':''}" data-domain="audio" data-id="${room.id}">👂</button>
      <button class="perf ${all||room.domain==='perf'?'on':''}" data-domain="perf" data-id="${room.id}">★</button>
      <button class="visual ${all||room.domain==='visual'?'on':''}" data-domain="visual" data-id="${room.id}">👁</button>
    `;
  }

  /* =========================================================
    13) بناء HTML لكل حجرة
  ========================================================= */
  function roomHTML(room){
    const zero=+room.tasks===0?'zero':'';
    const female=room.gender==='girl'?'female':'';

    return `
      <div class="cell">
        <div class="room ${room.state} ${zero} ${female} ${room.leader?'leader':''}" data-id="${room.id}">
          ${room.leader?'':`<button class="delete" data-delete="${room.id}">×</button>`}
          <button class="settings" data-settings="${room.id}">⚙</button>

          <div class="statusName ${room.state}"><span class="dot"></span><span>${room.name}</span></div>
          <div class="lamp"></div><div class="glow"></div>
          <div class="bubble">${room.phrase}</div>

          ${room.state==='sleep'?'<div class="zzz">Zz</div>':''}
          ${room.state==='leave'?'<div class="ghost"></div><div class="leaveSign">🏖 إجازة</div>':`<canvas class="char" data-canvas="${room.id}"></canvas>`}
          <div class="meetIcon">اجتماع 💬</div>

          <div class="taskPanel"><div class="small">التاسكات</div><input data-task="${room.id}" value="${room.tasks}" type="number" min="0"></div>
          <div class="domain">${domainBtns(room)}</div>
          <div class="mug"><span class="mugIcon"></span></div>
          <div class="laptop"><span class="bow"></span></div>
          <div class="desk"></div>
        </div>
      </div>
    `;
  }

  /* =========================================================
    14) render = قلب التطبيق
    يعيد بناء كل الغرف، ثم يرسم الشخصيات، ثم يربط الأحداث.
  ========================================================= */
  function render(){
    const roomsEl=$('rooms');
    roomsEl.innerHTML=rooms.map(roomHTML).join('')+'<div class="cell addCell"><button id="addInside">+ إضافة</button></div>';

    document.querySelectorAll('[data-canvas]').forEach(canvas=>{
      const room=rooms.find(x=>String(x.id)===String(canvas.dataset.canvas));
      if(room) drawPerson(canvas,room);
    });

    stats();
    bind();
  }

  /* تحديث الأرقام فوق */
  function stats(){
    $('activeCount').textContent=rooms.filter(r=>r.state==='active').length;
    $('meetingCount').textContent=rooms.filter(r=>r.state==='meeting').length;
    $('sleepCount').textContent=rooms.filter(r=>r.state==='sleep'||r.state==='leave').length;
    $('taskCount').textContent=rooms.reduce((sum,r)=>sum+(+r.tasks||0),0);
  }

  /* =========================================================
    15) bind = ربط التفاعلات
  ========================================================= */
  function bind(){
    document.querySelectorAll('.room').forEach(el=>{
      el.onclick=e=>{
        if(e.target.closest('button')||e.target.matches('input')) return;
        cycle(String(el.dataset.id));
      };
    });

    document.querySelectorAll('[data-task]').forEach(input=>{
      input.oninput=()=>{
        const id=String(input.dataset.task);
        rooms=rooms.map(room=>{
          if(String(room.id)!==id) return room;
          const tasks=Math.max(0,+input.value||0);
          return {...room,tasks,state:tasks>0?'active':room.state,phrase:tasks>0?phraseFor('active'):room.phrase};
        });
        save();render();
      };
    });

    document.querySelectorAll('[data-settings]').forEach(btn=>{
      btn.onclick=e=>{e.stopPropagation();openModal(String(btn.dataset.settings));};
    });

    document.querySelectorAll('[data-delete]').forEach(btn=>{
      btn.onclick=e=>{
        e.stopPropagation();
        rooms=rooms.filter(room=>String(room.id)!==String(btn.dataset.delete));
        save();render();
      };
    });

    document.querySelectorAll('[data-domain]').forEach(btn=>{
      btn.onclick=e=>{
        e.stopPropagation();
        const id=String(btn.dataset.id);
        rooms=rooms.map(room=>String(room.id)===id?{...room,domain:room.leader?'all':btn.dataset.domain}:room);
        save();render();
      };
    });

    const addInside=$('addInside');
    if(addInside) addInside.onclick=addRoom;
  }

  /* ترتيب الحالات */
  function nextState(state){
    return state==='active'?'meeting':state==='meeting'?'sleep':state==='sleep'?'leave':'active';
  }

  function cycle(id){
    rooms=rooms.map(room=>{
      if(String(room.id)!==id) return room;
      const state=nextState(room.state);
      return {...room,state,tasks:(state==='active'||state==='meeting')?Math.max(1,+room.tasks||0):0,phrase:phraseFor(state)};
    });
    save();render();
  }

  function addRoom(){
    const nums=rooms.filter(r=>!r.leader).map(r=>Number(r.id)).filter(Boolean);
    const id=nums.length?Math.max(...nums)+1:1;
    rooms.push(hydrate({id,name:'شخص '+id,gender:id%2?'boy':'girl',state:'sleep',tasks:0,domain:'audio',look:'normal'}));
    save();render();
  }

  /* فتح نافذة الإعدادات */
  function openModal(id){
    editingId=id;
    const room=rooms.find(x=>String(x.id)===id);
    if(!room) return;

    $('modalTitle').textContent=room.leader?'إعدادات يوسف':'إعدادات الحجرة';
    $('deleteBtn').style.display=room.leader?'none':'inline-block';
    $('fName').value=room.name;
    $('fGender').value=room.gender;
    $('fState').value=room.state;
    $('fTasks').value=room.tasks;
    $('fDomain').value=room.domain;
    $('fLook').value=room.look;
    $('modal').classList.add('show');
  }

  function closeModal(){
    $('modal').classList.remove('show');
    editingId=null;
  }

  function saveModal(){
    rooms=rooms.map(room=>{
      if(String(room.id)!==editingId) return room;
      return hydrate({
        ...room,
        name:$('fName').value,
        gender:$('fGender').value,
        state:$('fState').value,
        tasks:Math.max(0,+$('fTasks').value||0),
        domain:room.leader?'all':$('fDomain').value,
        look:$('fLook').value
      });
    });
    save();render();closeModal();
  }

  function deleteCurrent(){
    rooms=rooms.filter(room=>String(room.id)!==editingId);
    save();render();closeModal();
  }

  /* =========================================================
    16) بداية التشغيل
  ========================================================= */
  $('addBtn').onclick=addRoom;
  $('resetBtn').onclick=()=>{rooms=defaults.map(hydrate);save();render();};
  $('closeBtn').onclick=closeModal;
  $('cancelBtn').onclick=closeModal;
  $('saveBtn').onclick=saveModal;
  $('deleteBtn').onclick=deleteCurrent;
  $('modal').onclick=e=>{if(e.target===$('modal'))closeModal();};

  setInterval(()=>{
    rooms=rooms.map(room=>({...room,phrase:phraseFor(room.state)}));
    save();render();
  },7000);

  render();
})();
</script>
</body>
</html>
